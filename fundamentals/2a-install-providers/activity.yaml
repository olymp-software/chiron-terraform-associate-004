version: 1
type: quiz
theory_blocks:
  - kind: markdown
    data:
      content: |
        # Install and version Terraform providers

        This quiz checks how Terraform finds, installs and pins providers. Recall the
        `required_providers` block and provider source addresses, version constraint
        operators (especially `~>`), the dependency lock file `.terraform.lock.hcl`,
        and how `terraform init` and `terraform init -upgrade` select versions.

        Docs:
        - [Providers](https://developer.hashicorp.com/terraform/language/providers)
        - [Provider requirements](https://developer.hashicorp.com/terraform/language/providers/requirements)
        - [Dependency lock file](https://developer.hashicorp.com/terraform/language/files/dependency-lock)
        - [Lock and upgrade provider versions](https://developer.hashicorp.com/terraform/tutorials/configuration-language/provider-versioning)
data:
  questions:
    - kind: choice
      prompt: |
        Where should you declare the version constraint for a provider in Terraform 1.12?
      data:
        multiple: false
        options:
          - text: In the `version` argument of the `provider` block
            feedback: |
              The `version` argument in a `provider` block is deprecated and will be removed.
          - text: In the `required_providers` block inside the top-level `terraform` block
            correct: true
          - text: In the `.terraform.lock.hcl` file
            feedback: |
              The lock file is generated by `terraform init` and records the selected version; it must not be edited by hand.
          - text: In the CLI configuration file (`.terraformrc`)
            feedback: The CLI configuration file holds CLI settings such as the plugin cache, not version constraints.
      explanation: |
        Each provider gets an entry in `terraform { required_providers { ... } }` with a `source` and a `version`
        constraint. The `version` argument of the `provider` block is deprecated.

    - kind: choice
      prompt: |
        A configuration uses the following block. What is the fully-qualified source address of the provider?

        ```hcl
        terraform {
          required_providers {
            random = {
              version = ">= 3.0"
            }
          }
        }
        ```
      data:
        multiple: false
        options:
          - text: "`registry.terraform.io/random/random`"
            feedback: The namespace is not derived from the local name; Terraform implies the `hashicorp` namespace.
          - text: "`terraform.io/builtin/random`"
            feedback: Only the built-in `terraform` provider uses the `terraform.io/builtin` address.
          - text: Terraform reports an error because `source` is required
            feedback: The `source` argument is optional; Terraform uses an implied address when it is omitted.
          - text: "`registry.terraform.io/hashicorp/random`"
            correct: true
      explanation: |
        When `source` is omitted, Terraform uses the implied address
        `registry.terraform.io/hashicorp/<LOCAL NAME>`.

    - kind: choice
      prompt: |
        The provider source address has the format `[<HOSTNAME>/]<NAMESPACE>/<TYPE>`.
        Which hostname does Terraform use when it is omitted?
      data:
        multiple: false
        options:
          - text: "`registry.terraform.io`"
            correct: true
          - text: "`app.terraform.io`"
            feedback: "`app.terraform.io` is HCP Terraform, not the default provider registry."
          - text: "`github.com`"
            feedback: Providers are not installed from GitHub by default.
      explanation: |
        The hostname is optional and defaults to `registry.terraform.io`, the public Terraform Registry.

    - kind: choice
      prompt: |
        A provider requirement uses `version = "~> 1.0.4"`. Which versions satisfy it? Select all that apply.
      data:
        multiple: true
        options:
          - text: "`1.0.5`"
            correct: true
          - text: "`1.1.0`"
            feedback: "`~> 1.0.4` lets only the rightmost component (patch) increase, so `1.1.0` is excluded."
          - text: "`1.0.10`"
            correct: true
          - text: "`1.0.3`"
            feedback: "`~>` never allows a version lower than the one given."
      explanation: |
        The pessimistic constraint operator `~>` allows only the rightmost version component to increase:
        `~> 1.0.4` means `>= 1.0.4, < 1.1.0`.

    - kind: choice
      prompt: |
        Which constraint allows any `5.x` release starting from `5.20` but never `6.0`?
      data:
        multiple: false
        options:
          - text: "`>= 5.20`"
            feedback: This has no upper bound, so `6.0` would be allowed.
          - text: "`~> 5.20.0`"
            feedback: This only allows patch releases of `5.20` (`>= 5.20.0, < 5.21.0`).
          - text: "`~> 5.20`"
            correct: true
          - text: "`= 5.20`"
            feedback: This pins exactly one version.
      explanation: |
        `~> 5.20` lets the rightmost component (minor) increase: it is equivalent to `>= 5.20, < 6.0`.
        A comma-separated form `">= 5.20, < 6.0"` would also work.

    - kind: choice
      prompt: |
        What does the dependency lock file `.terraform.lock.hcl` record? Select all that apply.
      data:
        multiple: true
        options:
          - text: The selected version of each provider
            correct: true
          - text: Checksums (hashes) of the provider packages
            correct: true
          - text: The selected versions of remote modules
            feedback: The lock file tracks only provider dependencies; Terraform does not record module versions.
          - text: The IDs of managed infrastructure objects
            feedback: That is the job of the state, not the lock file.
      explanation: |
        Each `provider` block in the lock file has the source address, the selected `version`, the
        `constraints` (informational) and `hashes` used to verify packages. Module versions are not locked;
        use exact version constraints to pin modules.

    - kind: choice
      prompt: |
        True or false: the `.terraform.lock.hcl` file should be committed to version control together with
        the configuration.
      data:
        multiple: false
        options:
          - text: "True"
            correct: true
          - text: "False"
            feedback: HashiCorp recommends committing the lock file so that dependency changes go through code review.
      explanation: |
        The lock file belongs to the configuration as a whole and should be committed, so every run
        (CLI, HCP Terraform, Terraform Enterprise) installs the same provider versions.

    - kind: choice
      prompt: |
        The lock file records `hashicorp/aws` version `5.40.0`. The configuration requires `version = "~> 5.0"`,
        and version `5.80.0` is now available in the Registry. A teammate runs `terraform init` (no flags).
        Which version is used?
      data:
        multiple: false
        options:
          - text: "`5.80.0`, the newest version matching the constraint"
            feedback: Without `-upgrade`, `terraform init` reuses the version recorded in the lock file.
          - text: "`5.40.0`, the version recorded in the lock file"
            correct: true
          - text: Terraform fails because the lock file is out of date
            feedback: "`5.40.0` still satisfies `~> 5.0`, so there is no conflict."
      explanation: |
        When a lock file exists, `terraform init` reselects the recorded version even if a newer acceptable
        version exists. Use `terraform init -upgrade` to move to the newest version allowed by the constraints.

    - kind: choice
      prompt: |
        What does `terraform init -upgrade` do with providers?
      data:
        multiple: false
        options:
          - text: Upgrades Terraform CLI itself to the latest release
            feedback: "`terraform init` never upgrades the Terraform binary."
          - text: Ignores the version constraints and installs the latest provider releases
            feedback: Constraints are always respected; `-upgrade` only ignores the recorded lock file selections.
          - text: Ignores the lock file selections, picks the newest versions allowed by the constraints and updates the lock file
            correct: true
          - text: Only verifies the hashes in the lock file without downloading anything
            feedback: That is not what `-upgrade` does; it selects and downloads new versions.
      explanation: |
        `-upgrade` disregards the versions recorded in `.terraform.lock.hcl`, selects the newest versions
        matching the constraints (it can also downgrade if constraints changed) and rewrites the lock file.

    - kind: choice
      prompt: |
        Your team works on macOS and Linux, but the lock file was created on Windows. Which command
        pre-populates the lock file with checksums for several platforms?
      data:
        multiple: false
        options:
          - text: "`terraform providers lock -platform=linux_amd64 -platform=darwin_arm64`"
            correct: true
          - text: "`terraform init -lock=false`"
            feedback: "`-lock=false` disables state locking; it does not touch provider checksums."
          - text: "`terraform providers mirror`"
            feedback: This downloads providers into a local mirror directory; it does not update the lock file.
          - text: "`terraform get -update`"
            feedback: "`terraform get` downloads modules, not providers."
      explanation: |
        `terraform providers lock` records checksums for the platforms passed with `-platform`, so later
        installs on those platforms verify packages without adding new hashes.

    - kind: choice
      prompt: |
        Following HashiCorp's recommendations, which constraints fit a **reusable module** and a
        **root module**?
      data:
        multiple: false
        options:
          - text: "Reusable module: `~> 5.0`; root module: `>= 5.0`"
            feedback: This is reversed. Reusable modules should not set an upper bound.
          - text: "Both: an exact version such as `= 5.31.0`"
            feedback: Exact pins in reusable modules make them hard to combine; that is not the recommendation.
          - text: "Reusable module: `>= 5.0`; root module: `~> 5.0`"
            correct: true
      explanation: |
        All modules should declare a minimum version with `>=`. Reusable modules should not set maximums;
        the root module sets both bounds, usually with `~>`, to avoid unexpected upgrades.

    - kind: choice
      prompt: |
        True or false: the constraint `~> 1.2` will select the pre-release version `1.3.0-beta` if it is the
        newest available.
      data:
        multiple: false
        options:
          - text: "True"
            feedback: Range operators, including `~>`, never match pre-release versions.
          - text: "False"
            correct: true
      explanation: |
        A pre-release version can only be selected with an exact version (`= 1.3.0-beta` or no operator).
        `>`, `>=`, `<`, `<=` and `~>` ignore pre-releases.
