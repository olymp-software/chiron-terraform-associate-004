      - slug: 4f-dependencies
        title: 4f. Define resource dependencies
      - slug: 4g-custom-conditions
        title: 4g. Validate configuration using custom conditions
      - slug: 4h-sensitive-data
        title: 4h. Sensitive data and secrets management with Vault
